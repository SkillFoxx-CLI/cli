# Публикация в npm при выпуске релиза на GitHub через доверенную публикацию npm (Trusted Publishing, OIDC):
# токен не хранится, npm проверяет, что сборка идет из этого репозитория и этого файла, и ставит подпись provenance.
# На npmjs.com у пакета skillfoxx: Settings, Trusted Publisher, GitHub Actions, репозиторий и файл publish.yml.
name: publish
on:
  release:
    types: [published]
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # Доверенной публикации нужен npm не ниже 11.5.1.
      - run: npm install -g npm@latest
      - run: npm install --no-audit --no-fund
      - run: node build.mjs
      - run: node dist/cli.js --version
      - run: npm publish --provenance --access public
